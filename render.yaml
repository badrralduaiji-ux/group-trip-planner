services:
  - type: web
    name: group-trip-planner
    runtime: python
    plan: free
    buildCommand: |
      python - <<'PY'
      import base64
      import pathlib
      import zipfile

      payload = """"""
      archive = pathlib.Path("/tmp/group-trip-planner.zip")
      archive.write_bytes(base64.b64decode(payload))
      with zipfile.ZipFile(archive) as z:
          z.extractall(".")
      PY
      pip install -r group-trip-planner/requirements.txt
    startCommand: uvicorn app:app --app-dir group-trip-planner --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: group-trip-planner-db
          property: connectionString

databases:
  - name: group-trip-planner-db
    plan: free
